name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sinh Prisma Client (offline, từ schema) để typecheck thấy type của driver prisma.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n sync check
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

  # Quét bí mật (API key/token lỡ commit) trên toàn bộ lịch sử git bằng gitleaks.
  # Thay cho GitHub Secret Scanning (chỉ miễn phí ở repo public). Job đỏ = có thể lộ secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lấy full lịch sử để quét mọi commit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
