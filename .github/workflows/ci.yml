name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sinh Prisma Client (offline, từ schema) để typecheck thấy type của driver prisma.
      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: i18n sync check
        run: npm run check:i18n

      - name: Unit tests
        run: npm test

  # Quét bí mật (API key/token lỡ commit) trên toàn bộ lịch sử git bằng gitleaks.
  # Thay cho GitHub Secret Scanning (chỉ miễn phí ở repo public). Job đỏ = có thể lộ secret.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lấy full lịch sử để quét mọi commit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Quét CVE trong dependency.
  #  - Hard-fail CHỈ khi dependency RUNTIME (prod) có lỗ hổng CRITICAL — đây là thứ chạy trên VPS và
  #    cần vá ngay. Ngưỡng đặt ở "critical" (không phải "high") có chủ đích: các lỗ hổng high hiện tại
  #    (vd Next.js middleware advisory) chỉ vá được bằng nâng cấp MAJOR breaking (Next 16), đã theo dõi
  #    riêng ở sổ nợ kỹ thuật "Next 15/16 upgrade" — không để nó chặn MỌI PR.
  #  - Bước report chạy ở mức high+ cho cả prod lẫn dev để vẫn THẤY trong log CI (không chặn).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies (fail on CRITICAL)
        run: npm audit --omit=dev --audit-level=critical
      - name: Report high+ vulnerabilities (không chặn CI)
        run: npm audit --audit-level=high || true
