# ── Overlay cho VPS ĐÃ CÓ nginx (hoặc reverse proxy khác) giữ cổng 80/443 ──────────────────
# KHÔNG chạy Caddy (tránh đụng nginx của máy). App chỉ mở ở 127.0.0.1:3000 để nginx sẵn có của
# VPS reverse-proxy crm.qreview.asia vào (nginx lo TLS bằng certbot/Let's Encrypt).
#
# Dùng KÈM docker-compose.yml (KHÔNG dùng docker-compose.prod.yml vì file đó thêm Caddy 80/443):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
services:
  app:
    build:
      args:
        APP_URL: https://crm.qreview.asia
        # Một biến authoritative cho cả server rewrite và link public. Mặc định
        # đúng storefront production, không bao giờ tự trỏ về crm.qreview.asia.
        QREVIEW_SITE_URL: https://qreview.asia
        NEXT_PUBLIC_QREVIEW_SITE_URL: https://qreview.asia
    environment:
      # Next standalone bind theo HOSTNAME. Docker tự đặt HOSTNAME=<container-id> (ghi đè cả ENV
      # trong image) → app chỉ nghe IP container, KHÔNG nghe 127.0.0.1 → healthcheck fail → unhealthy.
      # Đặt ở đây (tầng compose = -e) để CHẮC CHẮN thắng → app nghe mọi interface, healthcheck pass.
      HOSTNAME: '0.0.0.0'
      # URL công khai — dùng cho link email, ảnh /generated, và chốt CSRF (Origin hợp lệ).
      APP_URL: https://crm.qreview.asia
      # Domain WEBSITE, tuyệt đối không phải domain CRM. Cũng truyền vào build ở trên.
      QREVIEW_SITE_URL: https://qreview.asia
      NEXT_PUBLIC_QREVIEW_SITE_URL: https://qreview.asia
      # Production BẮT BUỘC mật khẩu Postgres mạnh (fail nếu thiếu) — không rơi về 'seogeo'.
      DATABASE_URL: postgresql://seogeo:${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD mạnh trong .env}@db:5432/seogeo
    # !override THAY THẾ cổng của base (0.0.0.0:3000) → chỉ mở localhost, KHÔNG lộ app ra Internet.
    # (nginx của host gọi vào 127.0.0.1:3000; người ngoài chỉ vào được qua https://crm.qreview.asia.)
    ports: !override
      - '127.0.0.1:3000:3000'

  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD mạnh trong .env}
