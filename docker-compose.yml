# Chạy SEO-GEO self-host: docker compose up -d
# Mặc định STORAGE_DRIVER=file (.data trên volume). Khi cutover Postgres: đặt STORAGE_DRIVER=prisma
# trong .env (xem docs/POSTGRES-MIGRATION.md) — KHÔNG cần sửa file này.
services:
  app:
    build:
      context: .
      args:
        # Bien NEXT_PUBLIC_* bi Next NHUNG CUNG vao bundle luc `npm run build`, khong doc lai luc
        # chay → phai co mat ngay tu buoc build, khong the chi dat o `environment` ben duoi.
        NEXT_PUBLIC_QREVIEW_SITE_URL: ${NEXT_PUBLIC_QREVIEW_SITE_URL:-}
    ports:
      - '3000:3000'
    environment:
      # BẮT BUỘC ở production: 32 byte base64 (vd: openssl rand -base64 32)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Đặt ENCRYPTION_KEY trong .env}
      # URL CÔNG KHAI của app (vd https://demo.noti.vn) — dùng dựng link tuyệt đối: redirect
      # link chia sẻ, thẻ OG, link trong email, ảnh /generated/... Đặt trong .env khi chạy sau
      # reverse-proxy; bỏ trống thì app tự suy từ X-Forwarded-Host (Caddy đặt sẵn, Nginx phải
      # tự thêm proxy_set_header X-Forwarded-Host).
      APP_URL: ${APP_URL:-}
      # Email chủ nền tảng (superadmin) — phân tách bằng dấu phẩy. THIẾU biến này thì không ai vào
      # được trang Quản trị nền tảng /admin (kể cả owner). Lấy từ .env.
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      # Đa ngôn ngữ (tùy chọn — có mặc định trong code nếu bỏ trống).
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-}
      # Tùy chọn: khóa tự đăng ký sau khi có tài khoản đầu tiên
      DISABLE_SELF_REGISTRATION: ${DISABLE_SELF_REGISTRATION:-false}
      # Bí mật để worker/cron gọi /api/jobs/run (lịch đăng). Sinh: openssl rand -hex 16
      CRON_SECRET: ${CRON_SECRET:?Đặt CRON_SECRET trong .env}
      # Backend lưu trữ: 'file' (mặc định) | 'prisma' (Postgres, sau khi đã migrate dữ liệu).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-file}
      # Mật khẩu Postgres KHÔNG hardcode — lấy từ .env (mặc định 'seogeo' chỉ để chạy dev nhanh).
      DATABASE_URL: postgresql://seogeo:${POSTGRES_PASSWORD:-seogeo}@db:5432/seogeo
      REDIS_URL: redis://redis:6379
      # ── CSDL NOI DUNG cua WEBSITE Qreview (khu quan tri /qreview) ─────────────────────────
      # KHAC `DATABASE_URL` o tren: do la CSDL cua CRM (Postgres), con day la CSDL noi dung cua
      # website Qreview (MySQL). Thieu nhom bien nay thi MOI API /api/qreview/* tra 500 kem
      # thong bao "Cau hinh co so du lieu website chua day du." (xem src/lib/qreview/api.ts).
      #
      # LUU Y: file .env cua Docker Compose CHI dung de thay the ${...} trong chinh file compose
      # nay. Bien nam trong .env KHONG tu dong di vao container — phai khai bao tuong minh o day
      # thi tien trinh Next moi doc duoc.
      QREVIEW_DB_HOST: ${QREVIEW_DB_HOST:-}
      QREVIEW_DB_PORT: ${QREVIEW_DB_PORT:-3306}
      QREVIEW_DB_USER: ${QREVIEW_DB_USER:-}
      QREVIEW_DB_PASSWORD: ${QREVIEW_DB_PASSWORD:-}
      QREVIEW_DB_NAME: ${QREVIEW_DB_NAME:-}
      # Email duoc coi la admin TREN WEBSITE — khong lien quan quyen vao khu quan tri
      # (quyen do lay tu SUPERADMIN_EMAILS o tren).
      QREVIEW_ADMIN_EMAILS: ${QREVIEW_ADMIN_EMAILS:-}
      # Dia chi cong khai cua website Qreview (nut "Xem trang that", duong dan anh). Cung phai
      # truyen qua build arg o tren vi day la bien NEXT_PUBLIC_*.
      NEXT_PUBLIC_QREVIEW_SITE_URL: ${NEXT_PUBLIC_QREVIEW_SITE_URL:-}
      # Token server-to-server cua website, de CRM day anh tai len sang Qreview.
      QREVIEW_ADMIN_TOKEN: ${QREVIEW_ADMIN_TOKEN:-}
    volumes:
      - app-data:/app/.data
      - app-media:/app/public/generated
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Worker LỊCH ĐĂNG: định kỳ gọi /api/jobs/run của app để đăng bài đến hạn.
  worker:
    build: .
    command: ['node', 'scripts/worker.mjs']
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET:?Đặt CRON_SECRET trong .env}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seogeo
      # Mật khẩu lấy từ .env; ở production BẮT BUỘC đặt POSTGRES_PASSWORD mạnh (xem prod overlay).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seogeo}
      POSTGRES_DB: seogeo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seogeo -d seogeo']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
  app-media:
  db-data:
