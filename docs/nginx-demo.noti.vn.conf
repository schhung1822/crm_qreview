# nginx reverse proxy cho SEO-GEO → app container ở 127.0.0.1:3000.
# Dùng khi VPS đã có nginx (systemd) giữ 80/443 cho nhiều site khác.
#
# CÀI:
#   sudo cp docs/nginx-demo.noti.vn.conf /etc/nginx/sites-available/demo.noti.vn
#   sudo ln -s /etc/nginx/sites-available/demo.noti.vn /etc/nginx/sites-enabled/demo.noti.vn
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d demo.noti.vn        # tự thêm block 443 + chứng chỉ + redirect http→https
#
# (Nếu nginx của bạn dùng /etc/nginx/conf.d/ thay cho sites-available thì copy vào conf.d/.)

server {
    listen 80;
    listen [::]:80;
    server_name demo.noti.vn;

    # Upload PDF/DOCX/ảnh: app cho tới ~25MB. nginx mặc định chỉ 1MB → sẽ chặn nếu không đặt.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Giữ Host gốc để app chốt CSRF (so Origin với Host) và sinh link đúng domain.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Streaming phản hồi AI (SSE) — tắt buffering để chữ hiện dần, tăng timeout cho tác vụ dài.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Sau khi chạy `certbot --nginx -d demo.noti.vn`, certbot sẽ TỰ chèn server block listen 443 (TLS)
# + chuyển hướng 80→443 vào file này. Không cần sửa tay.
