# nginx cho SEO-GEO khi ĐỨNG SAU Cloudflare (proxy BẬT — đám mây cam).
# Dùng Cloudflare Origin Certificate (miễn phí, hạn 15 năm) + SSL/TLS mode = Full (strict).
# KHÔNG dùng certbot/Let's Encrypt (Cloudflare đã lo cert phía trình duyệt).
#
# CHUẨN BỊ (làm 1 lần):
#  1) Cloudflare dashboard (domain noti.vn) → SSL/TLS → Overview → đặt = "Full (strict)".
#  2) SSL/TLS → Origin Server → Create Certificate → để mặc định (RSA; hostnames gồm demo.noti.vn
#     hoặc *.noti.vn) → Create → COPY riêng 2 phần: "Origin Certificate" và "Private Key".
#  3) Trên VPS lưu 2 phần vào file:
#       sudo mkdir -p /etc/ssl/cloudflare
#       sudo nano /etc/ssl/cloudflare/demo.noti.vn.pem   # dán "Origin Certificate", lưu
#       sudo nano /etc/ssl/cloudflare/demo.noti.vn.key   # dán "Private Key", lưu
#       sudo chmod 600 /etc/ssl/cloudflare/demo.noti.vn.key
#  4) Copy file .conf này vào nginx → nginx -t → reload (xem hướng dẫn trong chat).

# HTTP :80 → ép sang HTTPS (Cloudflare Full strict gọi origin qua 443; để phòng truy cập 80).
server {
    listen 80;
    listen [::]:80;
    server_name demo.noti.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.noti.vn;

    # Cloudflare Origin Certificate (KHÔNG phải Let's Encrypt).
    ssl_certificate     /etc/ssl/cloudflare/demo.noti.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/demo.noti.vn.key;

    # Upload PDF/DOCX/ảnh: app cho tới ~25MB (Cloudflare Free cho 100MB nên không vướng).
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # IP THẬT của khách do Cloudflare gửi qua CF-Connecting-IP (nếu dùng $remote_addr sẽ ra IP
        # của Cloudflare → rate-limit của app tính nhầm chung mọi khách). Lấy đúng IP khách ở đây.
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Streaming phản hồi AI (SSE) — tắt buffering để chữ hiện dần, tăng timeout tác vụ dài.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
